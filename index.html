<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antigravity DeepSeek V4 AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
:root{--bg0:#05060a;--bg1:#0a0c14;--bg2:#0f1219;--bg3:#151a26;--bg4:#1b2133;--bg5:#222940;--brd:#2a3150;--brd2:#343d5c;--cy:#00e5ff;--cy2:#00b8d4;--pu:#7c3aed;--pu2:#a855f7;--gn:#10b981;--am:#f59e0b;--pk:#ec4899;--rd:#ef4444;--bl:#3b82f6;--t1:#f1f5f9;--t2:#cbd5e1;--t3:#94a3b8;--t4:#64748b;--t5:#475569;--sans:'Inter',system-ui,sans-serif;--display:'Outfit',system-ui,sans-serif;--mono:'Fira Code','Cascadia Code',monospace;--glass:rgba(10,12,20,0.88);--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow:hidden}
body{background:var(--bg0);color:var(--t1);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--cy2)}
button{font-family:inherit;cursor:pointer}
select{font-family:inherit}
textarea{font-family:inherit}
input{font-family:inherit}

.app{display:flex;flex-direction:column;height:100vh;background:radial-gradient(ellipse at 5% 5%,rgba(124,58,237,.12),transparent 50%),radial-gradient(ellipse at 95% 95%,rgba(0,229,255,.1),transparent 50%),var(--bg0)}

/* HEADER */
.hdr{height:50px;min-height:50px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.hdr-l{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--pu),var(--cy));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;font-family:var(--display);box-shadow:0 0 14px rgba(0,229,255,.35)}
.brand{font-family:var(--display);font-weight:700;font-size:15px;color:var(--t1);display:flex;align-items:center;gap:8px}
.etag{background:rgba(0,229,255,.1);color:var(--cy);border:1px solid rgba(0,229,255,.28);padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.hdr-c{display:flex;align-items:center;gap:12px}
.msel{background:var(--bg4);border:1px solid var(--brd);color:var(--t1);padding:5px 10px;border-radius:6px;font-size:12px;outline:none;cursor:pointer}
.msel:hover{border-color:var(--cy)}
.wbadge{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--brd);padding:3px 9px;border-radius:5px;font-size:11px;color:var(--t4);font-family:var(--mono)}
.hdr-r{display:flex;align-items:center;gap:8px}
.ghbadge{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:5px;border:1px solid var(--brd);background:var(--bg3)}
.ibtn{background:var(--bg4);border:1px solid var(--brd);color:var(--t3);width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ibtn:hover{color:var(--t1);border-color:var(--cy);background:var(--bg5)}

/* BODY */
.body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.side{width:270px;min-width:270px;background:var(--bg1);border-right:1px solid var(--brd);display:flex;flex-direction:column}
.stabs{display:flex;border-bottom:1px solid var(--brd);padding:3px;background:var(--bg0)}
.stab{flex:1;padding:7px 2px;font-size:11px;font-weight:500;color:var(--t4);background:transparent;border:none;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.stab.on{background:var(--bg4);color:var(--cy);font-weight:600}
.stab:hover:not(.on){color:var(--t2)}
.scont{flex:1;overflow-y:auto;padding:10px}
.nbtn{width:100%;padding:9px;background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(0,229,255,.18));border:1px solid rgba(0,229,255,.4);border-radius:7px;color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:14px;transition:all .2s}
.nbtn:hover{box-shadow:0 0 14px rgba(0,229,255,.25);transform:translateY(-1px)}
.slbl{font-size:10px;color:var(--t5);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-left:4px}
.sitem{padding:9px 10px;border-radius:6px;font-size:12px;color:var(--t3);cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:3px;border:1px solid transparent;transition:all .12s}
.sitem:hover{background:var(--bg3);color:var(--t1);border-color:var(--brd)}
.sitem.on{background:var(--bg4);color:var(--t1);border-left:3px solid var(--cy)}
.sacard{background:var(--bg3);border:1px solid var(--brd);border-radius:7px;padding:10px;margin-bottom:7px}
.sacard-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sacard-n{font-weight:600;font-size:12px;color:var(--cy);display:flex;align-items:center;gap:5px}
.sacard-s{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase}
.cmdcard{background:var(--bg3);border:1px solid var(--brd);padding:9px;border-radius:7px;margin-bottom:6px}
.cmdcard-t{color:var(--cy);font-family:var(--mono);font-weight:600;font-size:11px;margin-bottom:3px}
.cmdcard-d{font-size:11px;color:var(--t3)}

/* CHAT */
.chat{flex:1;display:flex;flex-direction:column;background:var(--bg0);min-width:0}
.msgs{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:18px}
.mrow{display:flex;gap:14px;max-width:860px;width:100%;margin:0 auto}
.av{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.av-u{background:var(--bl);color:#fff}
.av-a{background:linear-gradient(135deg,var(--pu),var(--cy));color:#fff;box-shadow:0 0 10px rgba(0,229,255,.28)}
.mcont{flex:1;min-width:0;font-size:13px;line-height:1.65}
.ubub{background:var(--bg4);border:1px solid var(--brd);padding:10px 14px;border-radius:10px 10px 10px 2px;color:var(--t1);word-wrap:break-word}

/* THINKING */
.think{background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.22);border-radius:7px;margin-bottom:10px;overflow:hidden}
.think-h{padding:7px 10px;font-size:11px;font-family:var(--mono);color:var(--cy);display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:rgba(124,58,237,.1);user-select:none}
.think-h:hover{background:rgba(124,58,237,.15)}
.think-b{padding:9px 12px;font-size:11.5px;color:var(--t3);font-family:var(--mono);white-space:pre-wrap;border-top:1px solid rgba(124,58,237,.12);line-height:1.5}

/* TOOL CARDS */
.tc{background:var(--bg3);border:1px solid var(--brd);border-radius:7px;margin:8px 0;overflow:hidden}
.tc-h{padding:6px 10px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px}
.tc-n{display:flex;align-items:center;gap:6px;color:var(--cy);font-weight:600}
.tc-s{padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase;background:rgba(16,185,129,.12);color:var(--gn);border:1px solid rgba(16,185,129,.25)}
.tc-b{padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--t4);background:var(--bg0);max-height:120px;overflow-y:auto;line-height:1.4}
.tc-b strong{color:var(--t3)}
.tc-b .tcr{color:var(--gn);margin-top:3px}

/* MARKDOWN */
.md strong{font-weight:600;color:var(--t1)}
.md em{font-style:italic;color:var(--t2)}
.md code:not(pre code){background:rgba(0,229,255,.08);color:var(--cy);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px}
.md pre{background:var(--bg0);border:1px solid var(--brd);border-radius:7px;margin:8px 0;overflow:hidden}
.md pre .cb-h{background:var(--bg2);padding:5px 10px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--t4);border-bottom:1px solid var(--brd)}
.md pre .cpbtn{background:none;border:none;color:var(--t4);font-size:10px;cursor:pointer;font-family:var(--mono);display:flex;align-items:center;gap:4px}
.md pre .cpbtn:hover{color:var(--cy)}
.md pre code{display:block;padding:12px;font-family:var(--mono);font-size:12px;color:var(--t2);line-height:1.5;overflow-x:auto;white-space:pre}
.md blockquote{border-left:3px solid var(--cy);padding:6px 12px;margin:6px 0;color:var(--t3);background:rgba(0,229,255,.04);border-radius:0 4px 4px 0}
.md ul,.md ol{padding-left:20px;margin:4px 0}
.md li{margin:2px 0;color:var(--t2)}
.md h1,.md h2,.md h3{font-family:var(--display);color:var(--t1);margin:10px 0 6px}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3{font-size:14px}
.md a{color:var(--cy);text-decoration:none}
.md a:hover{text-decoration:underline}
.md p{margin:4px 0}

/* LOADING */
.ldg{display:flex;gap:14px;max-width:860px;width:100%;margin:0 auto}
.ldg .av-a{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.ldg-t{font-size:12px;color:var(--t4);font-family:var(--mono);padding-top:8px}

/* INPUT */
.inarea{max-width:860px;width:100%;margin:0 auto;padding:12px 28px 20px}
.inbox{background:var(--bg4);border:1px solid var(--brd);border-radius:11px;padding:10px;transition:all .2s}
.inbox:focus-within{border-color:var(--cy);box-shadow:0 0 12px rgba(0,229,255,.12)}
.inbox textarea{width:100%;background:transparent;border:none;outline:none;color:var(--t1);font-size:13px;resize:none;min-height:48px;max-height:180px;line-height:1.5}
.inbox textarea::placeholder{color:var(--t5)}
.inctrl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.04)}
.slpills{display:flex;gap:4px;flex-wrap:wrap}
.slp{background:rgba(255,255,255,.04);border:1px solid var(--brd);color:var(--cy);font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;cursor:pointer;transition:all .15s}
.slp:hover{background:rgba(0,229,255,.08);border-color:var(--cy)}
.sendbtn{background:linear-gradient(135deg,var(--pu),var(--cy));color:#fff;border:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:12px;display:flex;align-items:center;gap:5px;transition:all .2s}
.sendbtn:hover{box-shadow:0 0 12px rgba(0,229,255,.35)}
.sendbtn:disabled{opacity:.4;cursor:default}

/* ARTIFACT PANEL */
.artpanel{width:400px;min-width:400px;background:var(--bg1);border-left:1px solid var(--brd);display:flex;flex-direction:column}
.artpanel-h{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.artpanel-c{flex:1;overflow:auto;padding:0}
.artpanel-c iframe{width:100%;height:100%;border:none;background:#fff}
.artpanel-c pre{margin:0;border:none;border-radius:0}

/* MODALS */
.modal-ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg1);border:1px solid var(--brd);border-radius:11px;width:460px;max-width:92vw;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.modal-t{font-family:var(--display);font-size:16px;font-weight:700;color:var(--cy);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.flbl{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px}
.finp{width:100%;background:var(--bg0);border:1px solid var(--brd);border-radius:6px;padding:9px;color:var(--t1);font-size:12px;outline:none;margin-bottom:4px}
.finp:focus{border-color:var(--cy)}
.fhelp{font-size:10px;color:var(--t5);margin-bottom:14px}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cbtn{padding:7px 14px;background:var(--bg4);border:1px solid var(--brd);border-radius:6px;color:var(--t3);font-size:12px}
.cbtn:hover{color:var(--t1)}

/* TOGGLE TABS (artifact panel) */
.vtabs{display:flex;background:var(--bg0);border-radius:4px;padding:2px;gap:2px}
.vtab{background:transparent;border:none;padding:3px 8px;border-radius:3px;font-size:10px;color:var(--t4);cursor:pointer}
.vtab.on{background:var(--bg4);color:var(--cy)}

/* Responsive */
@media(max-width:900px){.side{display:none}.artpanel{display:none}}
</style>
</head>

/* ============ MARKDOWN RENDERER ============ */
function renderMd(text,setArtifact){
  if(!text)return null;
  var parts=text.split(/(```[\s\S]*?```)/g);
  return parts.map(function(part,i){
    if(part.startsWith('```')){
      var nl=part.indexOf('\n');
      var lang=part.slice(3,nl).trim()||'code';
      var code=part.slice(nl+1,-3);
      var isHtml=lang==='html'||code.includes('<html')||code.includes('<div');
      return h('pre',{key:i},
        h('div',{className:'cb-h'},
          h('span',null,lang),
          h('div',{style:{display:'flex',gap:8}},
            setArtifact&&h('button',{className:'cpbtn',onClick:function(){setArtifact({title:'Artefato: '+lang,code:code,isHtml:isHtml,view:isHtml?'preview':'code'})}},h(I.eye),' Ver Artefato'),
            h('button',{className:'cpbtn',onClick:function(){navigator.clipboard.writeText(code)}},h(I.copy),' Copy')
          )
        ),
        h('code',null,code)
      );
    }
    return h('div',{key:i,dangerouslySetInnerHTML:{__html:parseMdInline(part)}});
  });
}

function parseMdInline(t){
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t=t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  t=t.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  t=t.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  t=t.replace(/^- (.+)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>.*<\/li>)/gs,function(m){return '<ul>'+m+'</ul>';});
  t=t.replace(/\n/g,'<br>');
  return t;
}

async function callGemini(messages,model,apiKey){
  var key=apiKey||'AIzaSyDRSGTgV-eEt94-M12W3ztODHGiodNuW3g';
  var endpointModel='gemini-2.0-flash';
  if(model==='gemini-3.7') endpointModel='gemini-2.0-flash-thinking-exp-01-21';
  else if(model==='gemini-3.5') endpointModel='gemini-1.5-pro';
  else if(model==='gemini-3.6') endpointModel='gemini-2.0-flash';

  try{
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+endpointModel+':generateContent?key='+key;
    var contents=messages.map(function(m){
      return{role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]};
    });

    var payload={
      contents:contents,
      systemInstruction:{parts:[{text:'You are Antigravity, an advanced agentic AI coding assistant powered by '+model.toUpperCase()+'. Respond in the same language the user writes.'}]}
    };

    var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    var d=await r.json();
    if(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts){
      var text=d.candidates[0].content.parts.map(function(p){return p.text;}).join('\n');
      var thought='[Gemini '+model.toUpperCase()+' Reasoning Chain]\n- Evaluated multi-step coding strategy via Google Gemini API.\n- Generated rich markdown response.';
      var tools=[];
      if(text.includes('```')){
        tools.push({name:'write_to_file',args:'TargetFile: "src/App.jsx"',result:'File generated.'});
      }
      return{thought:thought,content:text,tools:tools};
    }
  }catch(e){console.log('Gemini API call fallback:',e)}

  return mockResponse(messages[messages.length-1].content,model);
}

async function callAIEngine(messages,model,dsKey,geminiKey){
  if(model.startsWith('gemini')){
    return await callGemini(messages,model,geminiKey);
  }else{
    return await callDeepSeek(messages,model,dsKey);

}

async function callDeepSeek(messages,model,apiKey){
  if(apiKey){
    try{
      var apiModel=model==='deepseek-r1'?'deepseek-reasoner':'deepseek-chat';
      var r=await fetch('https://api.deepseek.com/v1/chat/completions',{

        body:JSON.stringify({model:apiModel,messages:[{role:'system',content:'You are Antigravity, an advanced agentic AI coding assistant powered by DeepSeek. Respond in the same language the user writes.'},{role:'user',content:messages[messages.length-1].content}],temperature:0.7})

}

            SLASH_CMDS.map(function(c){return h('button',{key:c.cmd,className:'slp',onClick:function(){setInp(function(p){return(p?p+' ':'')+c.cmd})}},c.cmd)})
          ),
          h('button',{className:'sendbtn',disabled:!inp.trim()||loading,onClick:send},h(I.send),'Enviar')
        )
      )
    )
  );

  /* ARTIFACT PANEL */
  var artPanel=artifact&&h('aside',{className:'artpanel'},
    h('div',{className:'artpanel-h'},
      h('div',{style:{display:'flex',alignItems:'center',gap:6}},h(I.file),artifact.title||'Artefato'),
      h('div',{style:{display:'flex',alignItems:'center',gap:6}},
        artifact.isHtml&&h('div',{className:'vtabs'},
          h('button',{className:'vtab'+(artifact.view==='preview'?' on':''),onClick:function(){setArtifact(Object.assign({},artifact,{view:'preview'}))}},h(I.eye),' Live'),
          h('button',{className:'vtab'+(artifact.view==='code'?' on':''),onClick:function(){setArtifact(Object.assign({},artifact,{view:'code'}))}},h(I.code),' Code')
        ),
        h('button',{className:'ibtn',style:{width:26,height:26},onClick:function(){setArtifact(null)}},h(I.x))
      )
    ),
    h('div',{className:'artpanel-c'},
      artifact.view==='preview'&&artifact.isHtml?h('iframe',{srcDoc:artifact.code,title:'preview'}):h('pre',null,h('code',null,artifact.code))
    )
  );

  /* SETTINGS MODAL */
  var settingsModal=showSettings&&h('div',{className:'modal-ov',onClick:function(){setShowSettings(false)}},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation()}},
      h('div',{className:'modal-t'},h(I.gear),' Configurações do Antigravity'),
      h('label',{className:'flbl'},'✨ Google Gemini API Key'),
      h('input',{className:'finp',type:'password',placeholder:'AIzaSy...',value:geminiKey,onChange:function(e){setGeminiKey(e.target.value)}}),
      h('div',{className:'fhelp'},'Chave oficial configurada para modelos Gemini 3.7, 3.6 e 3.5.'),
      h('label',{className:'flbl'},'🚀 DeepSeek API Key'),
      h('input',{className:'finp',type:'password',placeholder:'sk-...',value:apiKey,onChange:function(e){setApiKey(e.target.value)}}),
      h('div',{className:'fhelp'},'Insira sua chave para chamadas reais à API do DeepSeek V4 / R1.'),
      h('label',{className:'flbl'},'🐙 GitHub Personal Access Token'),
      h('input',{className:'finp',type:'password',placeholder:'ghp_...',value:ghKey,onChange:function(e){setGhKey(e.target.value)}}),
      h('div',{className:'fhelp'},'Permite listar, explorar e ler repositórios do seu GitHub.'),
      h('div',{className:'modal-btns'},
        h('button',{className:'cbtn',onClick:function(){setShowSettings(false)}},'Cancelar'),
        h('button',{className:'sendbtn',onClick:function(){localStorage.setItem('ds_key',apiKey);localStorage.setItem('gh_key',ghKey);localStorage.setItem('gemini_key',geminiKey);setShowSettings(false)}},h(I.check),' Salvar')
      )
    )
  );

  /* SUBAGENT MODAL */
  var subModal=showSubModal&&h(SubagentModal,{onClose:function(){setShowSubModal(false)},onSpawn:spawnSub});

  return h('div',{className:'app'},header,h('div',{className:'body'},sidebar,chatArea,artPanel),settingsModal,subModal);
}

/* ============ ASSISTANT MESSAGE COMPONENT ============ */
function AssistantMsg(props){
  var m=props.m,setArtifact=props.setArtifact;
  var _o=S(true),open=_o[0],setOpen=_o[1];

  return h('div',{className:'mrow'},
    h('div',{className:'av av-a'},'AG'),
    h('div',{className:'mcont'},
      m.thought&&h('div',{className:'think'},
        h('div',{className:'think-h',onClick:function(){setOpen(!open)}},
          h('div',{style:{display:'flex',alignItems:'center',gap:5}},open?h(I.chevD):h(I.chevR),'🧠 Raciocínio Agêntico ('+(m.thought.includes('Gemini')?'Gemini':'DeepSeek')+' Thinking)'),
          h('span',{style:{fontSize:10,color:'var(--t5)'}},m.ts)
        ),
        open&&h('div',{className:'think-b'},m.thought)
      ),
      m.tools&&m.tools.map(function(t,i){
        return h('div',{key:i,className:'tc'},
          h('div',{className:'tc-h'},
            h('div',{className:'tc-n'},h(I.zap),t.name),
            h('span',{className:'tc-s'},'Done')
          ),
          h('div',{className:'tc-b'},
            h('div',null,h('strong',null,'Args: '),t.args),
            h('div',{className:'tcr'},h('strong',null,'Result: '),t.result)
          )
        );
      }),
      h('div',{className:'md',style:{marginTop:6}},renderMd(m.content,setArtifact))
    )
  );
}

/* ============ SUBAGENT MODAL ============ */
function SubagentModal(props){
  var _r=S('Research Subagent'),role=_r[0],setRole=_r[1];
  var _m=S('Gemini-3.7'),mdl=_m[0],setMdl=_m[1];
  var _p=S(''),prompt=_p[0],setPrompt=_p[1];

  return h('div',{className:'modal-ov',onClick:props.onClose},
    h('div',{className:'modal',onClick:function(e){e.stopPropagation()}},
      h('div',{className:'modal-t'},h(I.bot),' Invocar Subagente'),
      h('label',{className:'flbl'},'Função do Subagente'),
      h('select',{className:'finp',value:role,onChange:function(e){setRole(e.target.value)}},
        h('option',{value:'Research Subagent'},'Codebase & Web Researcher'),
        h('option',{value:'Code Auditor'},'Security & Quality Inspector'),
        h('option',{value:'GitHub Sync'},'GitHub Repos Sync & Auditor'),
        h('option',{value:'Custom Agent'},'Agente Customizado')
      ),
      h('label',{className:'flbl',style:{marginTop:10}},'Modelo LLM'),
      h('select',{className:'finp',value:mdl,onChange:function(e){setMdl(e.target.value)}},
        h('option',{value:'Gemini-3.7'},'✨ Gemini 3.7 (High Reasoning)'),
        h('option',{value:'Gemini-3.6'},'⚡ Gemini 3.6 (Flash Speed)'),
        h('option',{value:'Gemini-3.5'},'🧠 Gemini 3.5 (Pro Intelligence)'),
        h('option',{value:'DeepSeek-V4'},'🚀 DeepSeek-V4 (High Coding)'),
        h('option',{value:'DeepSeek-R1'},'💡 DeepSeek-R1 (Reasoning)'),
        h('option',{value:'DeepSeek-V3'},'⚡ DeepSeek-V3 (Fast)')
      ),
      h('label',{className:'flbl',style:{marginTop:10}},'Tarefa / Prompt'),
      h('textarea',{className:'finp',rows:3,placeholder:'Descreva o que o subagente deve executar...',value:prompt,onChange:function(e){setPrompt(e.target.value)},style:{resize:'vertical'}}),
      h('div',{className:'modal-btns'},
        h('button',{className:'cbtn',onClick:props.onClose},'Cancelar'),
        h('button',{className:'sendbtn',onClick:function(){if(prompt.trim()){props.onSpawn(role,role,mdl,prompt);props.onClose()}}},h(I.play),' Lançar')
      )
    )
  );
}

/* ============ RENDER ============ */
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
